<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第四爱社区</title>
  <style>
    :root {
      --bg: #faf6f4; --card: #ffffff; --ink: #3a2f33; --sub: #9a8b90;
      --accent: #d4758c; --accent-light: #f3e4e6; --line: #efe6e8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased; padding-bottom: 64px;
    }
    .hidden { display: none !important; }

    .topbar {
      position: sticky; top: 0; background: rgba(255,255,255,.95);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
      padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; z-index: 10;
    }
    .topbar .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
    .topbar .user-info { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .topbar .user-info .nick { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar .btn-logout { background: transparent; border: 1px solid var(--line); color: var(--sub);
      padding: 4px 10px; border-radius: 12px; font-size: 12px; cursor: pointer;
    }

    .navbar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      background: #fff; border-top: 1px solid var(--line);
      display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .navbar .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: var(--sub); font-size: 11px; cursor: pointer; padding: 6px 0;
    }
    .navbar .nav-item.on { color: var(--accent); }
    .navbar .nav-item .icon { font-size: 22px; }
    .navbar .nav-fab {
      width: 48px; height: 48px; border-radius: 50%; background: var(--accent);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 28px; cursor: pointer; margin-top: -20px;
      box-shadow: 0 4px 12px rgba(212,117,140,.4);
    }

    .auth-wrap { max-width: 420px; margin: 60px auto 0; padding: 0 20px; }
    .auth-card { background: var(--card); border-radius: 16px; padding: 28px 22px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    .auth-card h2 { font-size: 20px; margin-bottom: 6px; }
    .auth-card .hint { font-size: 13px; color: var(--sub); margin-bottom: 20px; }
    .switch-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
    .switch-tabs .st { flex: 1; text-align: center; padding: 10px 0; font-size: 14px; color: var(--sub); cursor: pointer; }
    .switch-tabs .st.on { color: var(--accent); font-weight: 600; border-bottom: 2px solid var(--accent); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
    .field input, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 15px; outline: none; background: #fdfbfa; font-family: inherit;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .submit { width: 100%; padding: 12px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 6px;
    }
    .submit:active { opacity: .85; }
    .msg { font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
    .msg.err { color: #c0392b; }
    .msg.ok { color: #27ae60; }

    .tabs { display: flex; gap: 24px; padding: 14px 18px; background: #fff; border-bottom: 1px solid var(--line); }
    .tabs .tab { color: var(--sub); cursor: pointer; font-size: 15px; padding-bottom: 4px; }
    .tabs .tab.on { color: var(--accent); font-weight: 600; border-bottom: 2px solid var(--accent); }

    .feed { padding: 12px 12px 20px; display: flex; flex-direction: column; gap: 12px; }
    .post { background: var(--card); border-radius: 14px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    .post .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0; overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .post .meta { flex: 1; min-width: 0; }
    .post .name { font-size: 14px; font-weight: 600; }
    .post .time { font-size: 12px; color: var(--sub); }
    .post .content { font-size: 15px; line-height: 1.6; margin-bottom: 10px; white-space: pre-wrap; }
    .post .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tag { display: inline-block; background: var(--accent-light); color: var(--accent);
      font-size: 12px; padding: 3px 10px; border-radius: 10px;
    }
    .post .actions { display: flex; gap: 18px; color: var(--sub); font-size: 13px; }
    .post .actions span { cursor: pointer; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-content {
      background: #fff; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0;
      padding: 20px; max-height: 85vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h3 { font-size: 17px; }
    .modal-header .close { font-size: 24px; color: var(--sub); cursor: pointer; background: none; border: none; }
    .tag-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .tag-selector .tag-opt {
      background: var(--line); color: var(--sub); padding: 6px 14px; border-radius: 16px;
      font-size: 13px; cursor: pointer; border: 1px solid transparent;
    }
    .tag-selector .tag-opt.selected { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

    .profile { padding: 20px; }
    .profile-card { background: var(--card); border-radius: 16px; padding: 24px; text-align: center; }
    .profile-card .avatar { width: 80px; height: 80px; font-size: 32px; margin: 0 auto 12px; }
    .profile-card .nick { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .profile-card .bio { font-size: 14px; color: var(--sub); margin-bottom: 6px; }
    .profile-card .email { font-size: 13px; color: var(--sub); margin-bottom: 16px; }
    .btn-edit { background: var(--accent); color: #fff; border: none; padding: 10px 24px;
      border-radius: 20px; font-size: 14px; cursor: pointer;
    }

    .empty { text-align: center; padding: 60px 20px; color: var(--sub); font-size: 14px; }

    .avatar-preview {
      width: 80px; height: 80px; border-radius: 50%; background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 700; color: #fff; margin: 0 auto 12px; overflow: hidden;
    }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }

    /* 裁剪界面 */
    .crop-modal {
      position: fixed; inset: 0; background: #1a1a1a; z-index: 300;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .crop-viewport {
      position: relative; width: 280px; height: 280px; overflow: hidden;
      background: #333; border-radius: 8px; touch-action: none;
    }
    .crop-viewport img {
      position: absolute; max-width: none; user-select: none;
      -webkit-user-drag: none; pointer-events: none;
    }
    .crop-grid {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(rgba(255,255,255,.15) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(255,255,255,.15) 1px, transparent 1px);
      background-size: 70px 70px;
      box-shadow: inset 0 0 0 9999px rgba(0,0,0,.35);
    }
    .crop-controls { width: 280px; margin-top: 20px; color: #fff; }
    .crop-controls .zoom-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .crop-controls input[type="range"] { flex: 1; accent-color: #d4758c; }
    .crop-btns { display: flex; gap: 12px; margin-top: 16px; }
    .crop-btns button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; }
    .crop-btns .btn-cancel { background: #444; color: #fff; }
    .crop-btns .btn-ok { background: #d4758c; color: #fff; }
  </style>
</head>
<body>
  <div class="topbar hidden" id="topbar">
    <div class="logo">第四爱</div>
    <div class="user-info hidden" id="userInfo">
      <span class="nick" id="topNick"></span>
      <button class="btn-logout" id="logoutBtn">退出</button>
    </div>
  </div>

  <div class="auth-wrap hidden" id="authWrap">
    <div class="auth-card">
      <h2 id="authTitle">登录</h2>
      <div class="hint">用邮箱和密码登录社区</div>
      <div class="switch-tabs">
        <div class="st on" id="tabLogin">登录</div>
        <div class="st" id="tabSignup">注册</div>
      </div>
      <div class="field">
        <label>邮箱</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>密码（至少 6 位）</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <div class="field hidden" id="nickField">
        <label>昵称</label>
        <input type="text" id="nickname" placeholder="给自己起个名字">
      </div>
      <button class="submit" id="submitBtn">登录</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div id="mainArea" class="hidden">
    <div id="pageHome">
      <div class="tabs">
        <div class="tab on">推荐</div>
        <div class="tab">关注</div>
        <div class="tab">话题</div>
      </div>
      <div class="feed" id="feedList">
        <div class="empty">加载中...</div>
      </div>
    </div>

    <div id="pageDiscover" class="hidden">
      <div class="empty">遇见功能开发中...</div>
    </div>

    <div id="pageChat" class="hidden">
      <div class="empty">私信功能开发中...</div>
    </div>

    <div id="pageProfile" class="hidden">
      <div class="profile">
        <div class="profile-card">
          <div class="avatar" id="profileAvatar"></div>
          <div class="nick" id="profileNick"></div>
          <div class="bio" id="profileBio"></div>
          <div class="email" id="profileEmail"></div>
          <button class="btn-edit" id="btnEditProfile">编辑资料</button>
        </div>
      </div>
    </div>
  </div>

  <div class="navbar hidden" id="navbar">
    <div class="nav-item on" data-page="home">
      <div class="icon">🏠</div>
      <div>首页</div>
    </div>
    <div class="nav-item" data-page="discover">
      <div class="icon">✨</div>
      <div>遇见</div>
    </div>
    <div class="nav-fab" id="fabPublish">+</div>
    <div class="nav-item" data-page="chat">
      <div class="icon">💬</div>
      <div>微聊</div>
    </div>
    <div class="nav-item" data-page="profile">
      <div class="icon">👤</div>
      <div>我的</div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="publishModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>发布帖子</h3>
        <button class="close" id="closePublish">×</button>
      </div>
      <div class="field">
        <label>说点什么...</label>
        <textarea id="postContent" rows="6" placeholder="分享你的故事、想法..."></textarea>
      </div>
      <div class="field">
        <label>选择话题标签（可多选）</label>
        <div class="tag-selector" id="tagSelector">
          <div class="tag-opt" data-tag="关系讨论">关系讨论</div>
          <div class="tag-opt" data-tag="日常">日常</div>
          <div class="tag-opt" data-tag="求助">求助</div>
          <div class="tag-opt" data-tag="分享">分享</div>
          <div class="tag-opt" data-tag="情感">情感</div>
        </div>
      </div>
      <button class="submit" id="submitPost">发布</button>
      <div class="msg" id="publishMsg"></div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>编辑资料</h3>
        <button class="close" id="closeEdit">×</button>
      </div>
      <div class="field">
        <label>头像</label>
        <div class="avatar-preview" id="avatarPreview"></div>
        <input type="file" id="avatarFile" accept="image/*" style="font-size:13px;padding:8px;">
        <small style="color:#9a8b90;">可选，上传后自动显示（会存到 Supabase 存储）</small>
      </div>
      <div class="field">
        <label>昵称</label>
        <input type="text" id="editNick" placeholder="你的昵称">
      </div>
      <div class="field">
        <label>简介</label>
        <textarea id="editBio" rows="3" placeholder="介绍一下自己..."></textarea>
      </div>
      <button class="submit" id="submitEdit">保存</button>
      <div class="msg" id="editMsg"></div>
    </div>
  </div>

  <!-- 头像裁剪弹窗 -->
  <div class="crop-modal hidden" id="cropModal">
    <div class="crop-viewport" id="cropViewport">
      <img id="cropImg" alt="">
      <div class="crop-grid"></div>
    </div>
    <div class="crop-controls">
      <div class="zoom-row">
        <span>缩放</span>
        <input type="range" id="cropZoom" min="1" max="300" value="100">
      </div>
      <div class="crop-btns">
        <button class="btn-cancel" id="cropCancel">取消</button>
        <button class="btn-ok" id="cropConfirm">确定裁剪</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://eaadmvvpbelpzookqhwv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yeGWnZ4W0gGZlWT7QXg7sw_Hye-TjqD";
    const STORAGE_KEY = "sb.auth.token";

    const $ = id => document.getElementById(id);
    let authMode = "login";
    let currentUser = null;
    let currentProfile = null;
    let selectedTags = [];

    async function apiCall(endpoint, method = "GET", body = null) {
      const headers = {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      };
      const session = getStoredSession();
      if (session?.access_token) headers.Authorization = `Bearer ${session.access_token}`;
      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(`${SUPABASE_URL}${endpoint}`, opts);
      const text = await res.text();
      let data = null;
      if (text) {
        try { data = JSON.parse(text); } catch { data = null; }
      }
      if (!res.ok) {
        throw new Error(data?.msg || data?.message || data?.error_description || `请求失败(${res.status})`);
      }
      return data;
    }

    // 图片压缩：自动居中裁剪 + 压到合适尺寸
    function compressAvatar(file, maxSize = 256) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            try {
              // 居中裁剪成正方形
              const canvas = document.createElement("canvas");
              const side = Math.min(img.width, img.height);
              canvas.width = maxSize;
              canvas.height = maxSize;
              const ctx = canvas.getContext("2d");
              const sx = (img.width - side) / 2;
              const sy = (img.height - side) / 2;
              ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
              resolve(canvas.toDataURL("image/jpeg", 0.85));
            } catch (err) {
              reject(err);
            }
          };
          img.onerror = () => reject(new Error("图片读取失败"));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("文件读取失败"));
        reader.readAsDataURL(file);
      });
    }

    function getStoredSession() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
    }
    function setStoredSession(session) {
      if (session) localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
      else localStorage.removeItem(STORAGE_KEY);
    }

    async function signUp(email, password, nickname) {
      const data = await apiCall("/auth/v1/signup", "POST", { email, password, data: { nickname } });
      if (data.access_token) setStoredSession(data);
      return data;
    }
    async function signIn(email, password) {
      const data = await apiCall("/auth/v1/token?grant_type=password", "POST", { email, password });
      if (data.access_token) setStoredSession(data);
      return data;
    }
    async function signOut() {
      try { await apiCall("/auth/v1/logout", "POST"); } catch {}
      setStoredSession(null);
      currentUser = null; currentProfile = null;
      renderUnauthed();
    }
    async function getSession() {
      const stored = getStoredSession();
      if (!stored?.access_token) return null;
      try {
        const user = await apiCall("/auth/v1/user");
        return { user, access_token: stored.access_token };
      } catch {
        setStoredSession(null);
        return null;
      }
    }

    // 获取/创建用户资料
    async function getProfile(userId) {
      const data = await apiCall(`/rest/v1/profiles?id=eq.${userId}&limit=1`);
      return data[0] || null;
    }
    async function ensureProfile(user) {
      let profile = await getProfile(user.id);
      if (!profile) {
        // 首次登录自动创建资料
        const nickname = user.user_metadata?.nickname || user.email?.split("@")[0] || "用户";
        await apiCall("/rest/v1/profiles", "POST", {
          id: user.id, nickname, bio: "", avatar_url: ""
        });
        profile = await getProfile(user.id);
      }
      return profile;
    }
    async function updateProfile(userId, updates) {
      const data = await apiCall(`/rest/v1/profiles?id=eq.${userId}`, "PATCH", {
        ...updates, updated_at: new Date().toISOString()
      });
      return data;
    }

    async function fetchPosts() {
      const data = await apiCall("/rest/v1/posts?order=created_at.desc&limit=30");
      return data;
    }
    async function createPost(content, tags) {
      const data = await apiCall("/rest/v1/posts", "POST", {
        user_id: currentUser.id, content, tags
      });
      return data;
    }
    async function fetchProfiles(userIds) {
      if (userIds.length === 0) return {};
      const ids = userIds.join(",");
      const data = await apiCall(`/rest/v1/profiles?id=in.(${ids})`);
      const map = {};
      data.forEach(p => { map[p.id] = p; });
      return map;
    }

    function setMsg(text, type) {
      const m = $("msg"); m.textContent = text; m.className = "msg " + (type || "");
    }

    function switchMode(mode) {
      authMode = mode;
      const isLogin = mode === "login";
      $("authTitle").textContent = isLogin ? "登录" : "注册";
      $("nickField").classList.toggle("hidden", isLogin);
      $("submitBtn").textContent = isLogin ? "登录" : "注册";
      $("tabLogin").classList.toggle("on", isLogin);
      $("tabSignup").classList.toggle("on", !isLogin);
      setMsg("");
    }

    function renderAvatar(el, profile, fallback) {
      el.innerHTML = "";
      if (profile?.avatar_url) {
        const img = document.createElement("img");
        img.src = profile.avatar_url;
        el.appendChild(img);
      } else {
        el.textContent = fallback.charAt(0).toUpperCase();
      }
    }

    function renderProfile() {
      if (!currentProfile) return;
      const nick = currentProfile.nickname || "用户";
      $("topNick").textContent = nick;
      $("profileNick").textContent = nick;
      $("profileBio").textContent = currentProfile.bio || "这个人很懒，还没写简介";
      $("profileEmail").textContent = currentUser.email || "";
      renderAvatar($("profileAvatar"), currentProfile, nick);
    }

    async function loadPosts() {
      try {
        const posts = await fetchPosts();
        const userIds = [...new Set(posts.map(p => p.user_id).filter(Boolean))];
        const profileMap = await fetchProfiles(userIds);
        const feedList = $("feedList");
        if (posts.length === 0) {
          feedList.innerHTML = '<div class="empty">还没有帖子，快来发第一条吧！</div>';
          return;
        }
        feedList.innerHTML = posts.map(post => {
          const profile = profileMap[post.user_id] || {};
          const nick = profile.nickname || "匿名";
          const timeStr = new Date(post.created_at).toLocaleString("zh-CN", {
            month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"
          });
          const tagsHtml = (post.tags || []).map(tag => `<span class="tag"># ${tag}</span>`).join("");
          const avatarHtml = profile.avatar_url
            ? `<img src="${profile.avatar_url}">`
            : nick.charAt(0).toUpperCase();
          return `
            <div class="post">
              <div class="head">
                <div class="avatar">${avatarHtml}</div>
                <div class="meta">
                  <div class="name">${nick}</div>
                  <div class="time">${timeStr}</div>
                </div>
              </div>
              <div class="content">${escapeHtml(post.content)}</div>
              <div class="tags">${tagsHtml}</div>
              <div class="actions">
                <span>♥ 0</span>
                <span>💬 0</span>
                <span>↗ 分享</span>
              </div>
            </div>
          `;
        }).join("");
      } catch (e) {
        $("feedList").innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`;
      }
    }

    function escapeHtml(str) {
      return (str || "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function renderAuthed(user) {
      currentUser = user;
      $("authWrap").classList.add("hidden");
      $("topbar").classList.remove("hidden");
      $("mainArea").classList.remove("hidden");
      $("navbar").classList.remove("hidden");
      $("userInfo").classList.remove("hidden");
      currentProfile = await ensureProfile(user);
      renderProfile();
      loadPosts();
    }

    function renderUnauthed() {
      $("authWrap").classList.remove("hidden");
      $("topbar").classList.add("hidden");
      $("mainArea").classList.add("hidden");
      $("navbar").classList.add("hidden");
    }

    $("tabLogin").onclick = () => switchMode("login");
    $("tabSignup").onclick = () => switchMode("signup");

    $("submitBtn").onclick = async () => {
      const email = $("email").value.trim();
      const password = $("password").value;
      const nickname = $("nickname").value.trim();
      if (!email || !password) { setMsg("请把邮箱和密码都填上", "err"); return; }
      if (password.length < 6) { setMsg("密码至少 6 位", "err"); return; }
      if (authMode === "signup" && !nickname) { setMsg("注册请填个昵称", "err"); return; }
      setMsg(authMode === "login" ? "登录中…" : "注册中…");
      try {
        if (authMode === "signup") {
          const data = await signUp(email, password, nickname);
          if (data.access_token && data.user) {
            setMsg("注册成功", "ok");
            renderAuthed(data.user);
          } else {
            setMsg("注册成功！请去邮箱确认后，再回来登录", "ok");
          }
        } else {
          const data = await signIn(email, password);
          setMsg("登录成功", "ok");
          renderAuthed(data.user);
        }
      } catch (e) {
        setMsg(e.message, "err");
      }
    };

    $("logoutBtn").onclick = () => signOut();

    document.querySelectorAll(".nav-item").forEach(item => {
      item.onclick = () => {
        const page = item.dataset.page;
        document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("on"));
        item.classList.add("on");
        ["pageHome", "pageDiscover", "pageChat", "pageProfile"].forEach(id => {
          $(id).classList.add("hidden");
        });
        $("page" + page.charAt(0).toUpperCase() + page.slice(1)).classList.remove("hidden");
      };
    });

    $("fabPublish").onclick = () => {
      $("publishModal").classList.remove("hidden");
      $("postContent").value = "";
      selectedTags = [];
      document.querySelectorAll(".tag-opt").forEach(t => t.classList.remove("selected"));
      $("publishMsg").textContent = "";
    };
    $("closePublish").onclick = () => $("publishModal").classList.add("hidden");

    document.querySelectorAll(".tag-opt").forEach(opt => {
      opt.onclick = () => {
        const tag = opt.dataset.tag;
        if (selectedTags.includes(tag)) {
          selectedTags = selectedTags.filter(t => t !== tag);
          opt.classList.remove("selected");
        } else {
          selectedTags.push(tag);
          opt.classList.add("selected");
        }
      };
    });

    $("submitPost").onclick = async () => {
      const content = $("postContent").value.trim();
      if (!content) {
        $("publishMsg").textContent = "请输入内容";
        $("publishMsg").className = "msg err";
        return;
      }
      $("publishMsg").textContent = "发布中...";
      $("publishMsg").className = "msg";
      try {
        await createPost(content, selectedTags);
        $("publishMsg").textContent = "发布成功！";
        $("publishMsg").className = "msg ok";
        setTimeout(() => {
          $("publishModal").classList.add("hidden");
          loadPosts();
        }, 800);
      } catch (e) {
        $("publishMsg").textContent = e.message;
        $("publishMsg").className = "msg err";
      }
    };

    // 编辑资料
    $("btnEditProfile").onclick = () => {
      $("editModal").classList.remove("hidden");
      $("editNick").value = currentProfile?.nickname || "";
      $("editBio").value = currentProfile?.bio || "";
      $("editMsg").textContent = "";
      $("avatarFile").value = "";
      avatarBase64 = null;
      renderAvatar($("avatarPreview"), currentProfile, currentProfile?.nickname || "用");
    };
    $("closeEdit").onclick = () => $("editModal").classList.add("hidden");

    let avatarBase64 = null;
    let cropState = null;

    $("avatarFile").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      // 读取原图，打开裁剪界面
      const reader = new FileReader();
      reader.onload = (ev) => openCropModal(ev.target.result);
      reader.readAsDataURL(file);
    };

    function openCropModal(dataUrl) {
      const img = $("cropImg");
      img.onload = () => {
        const vw = 280; // viewport 边长
        const ow = img.naturalWidth;
        const oh = img.naturalHeight;
        // 初始：cover 填满 viewport
        const baseScale = Math.max(vw / ow, vw / oh);
        cropState = {
          ow, oh, vw,
          scale: baseScale,
          tx: (vw - ow * baseScale) / 2,
          ty: (vw - oh * baseScale) / 2,
          dragging: false, startX: 0, startY: 0, origTx: 0, origTy: 0
        };
        $("cropZoom").value = 100;
        applyCropTransform();
        $("cropModal").classList.remove("hidden");
      };
      img.src = dataUrl;
    }

    function applyCropTransform() {
      const img = $("cropImg");
      img.style.transform = `translate(${cropState.tx}px, ${cropState.ty}px) scale(${cropState.scale})`;
    }

    function closeCropModal() {
      $("cropModal").classList.add("hidden");
    }

    // 拖动
    $("cropViewport").addEventListener("pointerdown", (e) => {
      if (!cropState) return;
      cropState.dragging = true;
      cropState.startX = e.clientX;
      cropState.startY = e.clientY;
      cropState.origTx = cropState.tx;
      cropState.origTy = cropState.ty;
      $("cropViewport").setPointerCapture(e.pointerId);
    });
    $("cropViewport").addEventListener("pointermove", (e) => {
      if (!cropState || !cropState.dragging) return;
      cropState.tx = cropState.origTx + (e.clientX - cropState.startX);
      cropState.ty = cropState.origTy + (e.clientY - cropState.startY);
      applyCropTransform();
    });
    $("cropViewport").addEventListener("pointerup", () => {
      if (cropState) cropState.dragging = false;
    });

    // 缩放滑条
    $("cropZoom").addEventListener("input", (e) => {
      if (!cropState) return;
      const ratio = parseInt(e.target.value) / 100;
      const vw = cropState.vw;
      const ow = cropState.ow, oh = cropState.oh;
      const baseScale = Math.max(vw / ow, vw / oh);
      const newScale = baseScale * ratio;
      // 以 viewport 中心为锚点缩放
      const cx = vw / 2, cy = vw / 2;
      cropState.tx = cx - (cx - cropState.tx) * (newScale / cropState.scale);
      cropState.ty = cy - (cy - cropState.ty) * (newScale / cropState.scale);
      cropState.scale = newScale;
      applyCropTransform();
    });

    $("cropCancel").onclick = () => {
      closeCropModal();
      $("avatarFile").value = "";
    };

    $("cropConfirm").onclick = () => {
      if (!cropState) return;
      // 计算裁剪框（viewport）对应的原始图片区域
      const { ow, oh, vw, scale, tx, ty } = cropState;
      const origX = (0 - tx) / scale;   // viewport 左上角对应原始图坐标
      const origY = (0 - ty) / scale;
      const cropSize = vw / scale;      // 裁剪框对应的原始尺寸
      const sx = Math.max(0, Math.min(ow - cropSize, origX));
      const sy = Math.max(0, Math.min(oh - cropSize, origY));
      const size = Math.min(cropSize, ow - sx, oh - sy);

      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");
      ctx.drawImage($("cropImg"), sx, sy, size, size, 0, 0, 256, 256);
      avatarBase64 = canvas.toDataURL("image/jpeg", 0.85);

      const previewImg = document.createElement("img");
      previewImg.src = avatarBase64;
      $("avatarPreview").innerHTML = "";
      $("avatarPreview").appendChild(previewImg);
      $("editMsg").textContent = "头像已裁剪好";
      $("editMsg").className = "msg ok";
      closeCropModal();
    };

    $("submitEdit").onclick = async () => {
      const nickname = $("editNick").value.trim();
      const bio = $("editBio").value.trim();
      if (!nickname) {
        $("editMsg").textContent = "昵称不能为空";
        $("editMsg").className = "msg err";
        return;
      }
      $("editMsg").textContent = "保存中...";
      $("editMsg").className = "msg";
      try {
        let avatar_url = currentProfile?.avatar_url || "";
        if (avatarBase64) {
          avatar_url = avatarBase64;
        }
        await updateProfile(currentUser.id, { nickname, bio, avatar_url });
        currentProfile = await getProfile(currentUser.id);
        renderProfile();
        $("editMsg").textContent = "保存成功！";
        $("editMsg").className = "msg ok";
        setTimeout(() => $("editModal").classList.add("hidden"), 800);
      } catch (e) {
        $("editMsg").textContent = e.message;
        $("editMsg").className = "msg err";
      }
    };

    async function handleAuthCallback() {
      const params = new URLSearchParams(location.search);
      const tokenHash = params.get('token_hash');
      const type = params.get('type');
      if (tokenHash && type === 'signup') {
        try {
          const data = await apiCall("/auth/v1/verify", "POST", { token_hash: tokenHash, type });
          if (data.access_token) {
            setStoredSession(data);
            history.replaceState(null, "", location.pathname);
            renderAuthed(data.user);
            return true;
          }
        } catch (e) {
          console.error("确认失败", e);
        }
      }
      return false;
    }

    (async () => {
      if (await handleAuthCallback()) return;
      const session = await getSession();
      if (session?.user) renderAuthed(session.user);
      else renderUnauthed();
    })();
  </script>
</body>
</html>
