<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第四爱社区</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #faf6f4; }
    .loading { text-align: center; padding: 60px 20px; }
    .loading h1 { font-size: 24px; margin-bottom: 20px; color: #3a2f33; }
    .loading p { font-size: 16px; color: #9a8b90; margin: 10px 0; }
    .status { background: #fff; border-radius: 12px; padding: 20px; margin-top: 20px; }
    .ok { color: #27ae60; }
    .err { color: #c0392b; }
  </style>
</head>
<body>
  <div class="loading">
    <h1>第四爱·社区</h1>
    <p>正在加载...</p>
    <div class="status" id="status">
      <p>1️⃣ HTML 加载: <span class="ok">✅ 成功</span></p>
      <p id="step2">2️⃣ 检测 JS 支持...</p>
      <p id="step3">3️⃣ 加载 Supabase SDK...</p>
    </div>
  </div>
  <script>
    document.getElementById('step2').innerHTML = '2️⃣ JS 支持: <span class="ok">✅ 正常</span>';
    setTimeout(() => {
      document.getElementById('step3').innerHTML = '3️⃣ Supabase SDK: <span class="err">❌ 加载失败（网络问题）</span><br><small style="color:#9a8b90;margin-top:10px;display:block">你的网络访问不了 Supabase CDN，需要换方案</small>';
    }, 2000);
  </script>
  <script src="https://unpkg.com/@supabase/supabase-js@2" onload="document.getElementById('step3').innerHTML='3️⃣ Supabase SDK: <span class=ok>✅ 加载成功</span>'"></script>
</body>
</html>
